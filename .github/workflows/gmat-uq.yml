name: GMAT-UQ tests

# Runs the GMAT-UQ test suite.  The tests that need a GMAT installation skip
# themselves here; they are run locally against GMAT R2026a (see
# gmat-uq/docs/validation.md).

on:
  push:
    paths:
      - "gmat-uq/**"
      - ".github/workflows/gmat-uq.yml"
  pull_request:
    paths:
      - "gmat-uq/**"
      - ".github/workflows/gmat-uq.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the gmat-uq folder
        uses: actions/checkout@v4
        with:
          sparse-checkout: gmat-uq
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e "gmat-uq[test]"
      - name: Test
        working-directory: gmat-uq
        run: python -m pytest
