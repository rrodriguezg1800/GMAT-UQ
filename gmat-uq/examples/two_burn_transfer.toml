# Two-burn transfer from a 7000 km to a 12000 km circular orbit, with two statistical
# corrections that target the arrival position.  This is validation test 3.
#
# Runs anywhere: the dynamics are the built-in two-body model, no GMAT needed.
#
#     gmat-uq run examples/two_burn_transfer.toml
#
# Generated by validation/make_examples.py.  Lengths in km, velocities in km/s, times in s.

[dynamics]
type = "two_body"
mu = 398600.4415

[mission]
initial_state = [7000.0, 0.0, 0.0, 0.0, 6.631600761910052, 3.6006654314056634]    # circular, inclination 28.5 deg
final_time = 5207.51112940626    # arrival at apoapsis
final_target = ["SMA", "INC", "RAAN"]

[mission.initial_dispersion]
sigmas = [0.2, 0.5, 0.2, 5e-4, 2e-4, 2e-4]    # radial, in-track, cross-track
frame = "RIC"

[error_models.Engine]
fixed_magnitude_sigma = 1e-05            # km/s
proportional_magnitude_sigma = 0.003     # fraction
fixed_pointing_sigma = 1e-05             # km/s per axis
proportional_pointing_sigma = 0.005      # rad per axis

[navigation.Tracking]
sigmas = [0.05, 0.05, 0.05, 5e-05, 5e-05, 5e-05]    # 50 m, 5 cm/s

[[maneuver]]
name = "Burn1"
time = 600.0
dv = [-0.5634549307479938, 0.6557078393652663, 0.35602030868097595]    # 934.978 m/s
error_model = "Engine"

[[maneuver]]
name = "TCM1"
time = 1751.877782351565
error_model = "Engine"
navigation = "Tracking"
target = ["X", "Y", "Z"]
target_time = 5207.51112940626

[[maneuver]]
name = "TCM2"
time = 4055.633347054695
error_model = "Engine"
navigation = "Tracking"
target = ["X", "Y", "Z"]
target_time = 5207.51112940626

[[maneuver]]
name = "Burn2"
time = 5207.51112940626
dv = [0.4918290850327692, -0.5723548931512854, -0.31076335145243894]    # 816.125 m/s
error_model = "Engine"

[analysis]
methods = ["lincov", "sigma_point", "monte_carlo"]
samples = 1000
seed = 42
workers = 4
report = "two_burn_transfer_report.json"
