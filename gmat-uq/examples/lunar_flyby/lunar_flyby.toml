# Translunar injection from a 185 km parking orbit to a lunar flyby, with three corrections
# that hold the lunar B-plane and the distance to the Moon at a fixed arrival time.
# This is validation test 4.  GMAT propagates everything, with the force model of
# cislunar.script (Earth, Moon and Sun point masses).
#
#     set GMAT_ROOT=C:\path\to\GMAT          (export GMAT_ROOT=... on Linux and macOS)
#     gmat-uq run examples/lunar_flyby/lunar_flyby.toml
#
# Epoch 01 Jan 2026 12:00:00.000 UTC; flight time 3.8622 days; perilune radius 3349 km.
# Generated by validation/make_examples.py.  Lengths in km, velocities in km/s, times in s.

[dynamics]
type = "gmat"
script = "cislunar.script"

[mission]
initial_state = [4522.805098815358, -4253.7728566843825, -2127.077145160699, 5.642309880665865, 4.653119779207772, 2.6918409116957642]    # on the parking orbit
final_time = 333691.4888800655
final_target = { parameters = ["BdotT", "BdotR"], body = "Luna" }

[mission.initial_dispersion]
sigmas = [0.5, 2.0, 0.5, 2e-3, 5e-4, 5e-4]    # radial, in-track, cross-track
frame = "RIC"

[error_models.UpperStage]
fixed_magnitude_sigma = 1e-05            # km/s
proportional_magnitude_sigma = 0.0005     # fraction
fixed_pointing_sigma = 1e-05             # km/s per axis
proportional_pointing_sigma = 0.0005      # rad per axis

[error_models.Thrusters]
fixed_magnitude_sigma = 1e-06            # km/s
proportional_magnitude_sigma = 0.005     # fraction
fixed_pointing_sigma = 1e-06             # km/s per axis
proportional_pointing_sigma = 0.005      # rad per axis

[navigation.Tracking1]
sigmas = [1.0, 1.0, 1.0, 1e-05, 1e-05, 1e-05]

[navigation.Tracking2]
sigmas = [2.0, 2.0, 2.0, 1e-05, 1e-05, 1e-05]

[navigation.Tracking3]
sigmas = [0.5, 0.5, 0.5, 5e-06, 5e-06, 5e-06]

[[maneuver]]
name = "TLI"
time = 0.0
dv = [2.365226962792683, 1.7722837461642336, 1.061659718314975]    # 3140.447 m/s
error_model = "UpperStage"

[[maneuver]]
name = "TCM1"
time = 21600.0
error_model = "Thrusters"
navigation = "Tracking1"
target = { parameters = ["BdotT", "BdotR", "RMAG"], body = "Luna" }
target_time = 333691.4888800655

[[maneuver]]
name = "TCM2"
time = 172800.0
error_model = "Thrusters"
navigation = "Tracking2"
target = { parameters = ["BdotT", "BdotR", "RMAG"], body = "Luna" }
target_time = 333691.4888800655

[[maneuver]]
name = "TCM3"
time = 268891.4888800655
error_model = "Thrusters"
navigation = "Tracking3"
target = { parameters = ["BdotT", "BdotR", "RMAG"], body = "Luna" }
target_time = 333691.4888800655

[analysis]
methods = ["lincov", "sigma_point", "monte_carlo"]
samples = 500
seed = 42
workers = 4
report = "lunar_flyby_report.json"
