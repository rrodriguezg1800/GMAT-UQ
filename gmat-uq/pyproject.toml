[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmat-uq"
version = "1.0.0"
description = "Linear covariance and navigation-aware Monte Carlo analysis for NASA GMAT missions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["GMAT", "astrodynamics", "covariance", "Monte Carlo", "navigation", "delta-V", "uncertainty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
plots = ["matplotlib>=3.7"]

[project.scripts]
gmat-uq = "gmat_uq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gmat: needs a GMAT installation (set GMAT_ROOT); skipped otherwise",
    "slow: long-running validation case",
]
filterwarnings = ["error::RuntimeWarning"]
